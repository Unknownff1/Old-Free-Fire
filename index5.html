<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLD FREE FIRE - Social Platform</title>

  <!-- Supabase JS Client (v2 CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #ff4757;
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0d1117;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .user-item, .post-item {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-item {
      flex-direction: column;
      align-items: flex-start;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .post-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .post-content {
      margin-top: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .alert-error {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid var(--accent-color);
      color: #ff6b81;
    }

    .alert-success {
      background: rgba(46, 213, 115, 0.2);
      border: 1px solid #2ed573;
      color: #2ed573;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header">🔥 OLD FREE FIRE SOCIAL 🔥</h1>

    <!-- Alert System -->
    <div id="alertBox" class="alert hidden"></div>

    <!-- AUTH SECTION -->
    <div id="authSection" class="card">
      <h2>রেজিস্ট্রেশন ও লগইন</h2>
      
      <!-- Registration Form -->
      <form id="registerForm">
        <input type="text" id="regDisplayName" placeholder="Display Name (e.g. Sakib Sarkar)" required />
        <input type="text" id="regUsername" placeholder="Username (e.g. sakib123)" required />
        <input type="email" id="regEmail" placeholder="Gmail Address" required />
        <input type="password" id="regPassword" placeholder="Password" required />
        <button type="submit" id="btnRegister">অ্যাকাউন্ট তৈরি করুন (Send OTP)</button>
      </form>

      <!-- OTP Verification Form (Hidden Initially) -->
      <form id="otpForm" class="hidden">
        <p style="margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted);">
          আপনার ইমেইলে পাঠানো 6-সংখ্যার OTP কোডটি লিখুন:
        </p>
        <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" required />
        <button type="submit" id="btnVerifyOtp">OTP ভেরিফাই করুন</button>
        <button type="button" id="btnResendOtp" style="background: transparent; border: 1px solid var(--border-color);">
          Resend OTP
        </button>
      </form>
    </div>

    <!-- MAIN PLATFORM SECTION (Hidden until authenticated) -->
    <div id="mainSection" class="hidden">

      <!-- Logged In User Status -->
      <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <strong id="userProfileName">User</strong>
          <div id="userProfileUsername" style="font-size: 0.8rem; color: var(--text-muted);">@username</div>
        </div>
        <button id="btnLogout" style="width: auto; padding: 6px 12px; margin: 0;">Logout</button>
      </div>

      <!-- SEARCH USER SECTION -->
      <div class="card">
        <h2>গ্লোবাল ইউজার সার্চ (Cross-Device)</h2>
        <input type="text" id="searchInput" placeholder="@username অথবা নাম দিয়ে খুঁজুন..." />
        <div id="searchResults"></div>
      </div>

      <!-- CREATE POST SECTION -->
      <div class="card">
        <h2>নতুন পোস্ট করুন</h2>
        <textarea id="postContent" rows="3" placeholder="আজকে আপনার মনে কী আছে?"></textarea>
        <button id="btnCreatePost">পোস্ট শেয়ার করুন</button>
      </div>

      <!-- GLOBAL FEED SECTION -->
      <div class="card">
        <h2>গ্লোবাল পোস্ট ফিড</h2>
        <div id="globalFeed">
          <p style="text-align: center; color: var(--text-muted);">পোস্ট লোড হচ্ছে...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. SUPABASE CONFIGURATION
    // -------------------------------------------------------------
    // Replace with your actual Supabase URL & Anon Key
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Global State Variables
    let currentUser = null;
    let pendingEmail = "";

    // DOM Elements
    const alertBox = document.getElementById('alertBox');
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const registerForm = document.getElementById('registerForm');
    const otpForm = document.getElementById('otpForm');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const postContent = document.getElementById('postContent');
    const btnCreatePost = document.getElementById('btnCreatePost');
    const globalFeed = document.getElementById('globalFeed');

    // -------------------------------------------------------------
    // 2. HELPER FUNCTIONS
    // -------------------------------------------------------------
    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 5000);
    }

    // Check Auth State on Page Load
    async function checkAuthSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        showMainApp();
      }
    }

    function showMainApp() {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      
      // Populate User Header
      document.getElementById('userProfileName').textContent = 
        currentUser.user_metadata?.display_name || 'Free Fire Player';
      document.getElementById('userProfileUsername').textContent = 
        `@${currentUser.user_metadata?.username || 'user'}`;

      // Load Data
      loadGlobalPosts();
      subscribeToRealtimePosts();
    }

    // -------------------------------------------------------------
    // 3. PRIORITY 1: REAL GMAIL OTP REGISTRATION
    // -------------------------------------------------------------
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const displayName = document.getElementById('regDisplayName').value.trim();
      const username = document.getElementById('regUsername').value.trim().toLowerCase().replace('@', '');
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { username, display_name: displayName }
          }
        });

        if (error) throw error;

        pendingEmail = email;
        registerForm.classList.add('hidden');
        otpForm.classList.remove('hidden');
        showAlert('আপনার ইমেইলে ৬-সংখ্যার OTP কোড পাঠানো হয়েছে!', 'success');
      } catch (err) {
        showAlert(err.message);
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('otpCode').value.trim();

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          email: pendingEmail,
          token: token,
          type: 'signup'
        });

        if (error) throw error;

        currentUser = data.user;
        showAlert('ইমেইল সফলভাবে ভেরিফাই করা হয়েছে!', 'success');
        showMainApp();
      } catch (err) {
        showAlert('ভুল অথবা মেয়ারোত্তীর্ণ OTP। আবার চেষ্টা করুন।');
      }
    });

    document.getElementById('btnResendOtp').addEventListener('click', async () => {
      if (!pendingEmail) return;
      try {
        const { error } = await supabase.auth.resend({ type: 'signup', email: pendingEmail });
        if (error) throw error;
        showAlert('নতুন OTP পাঠানো হয়েছে!', 'success');
      } catch (err) {
        showAlert(err.message);
      }
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.reload();
    });

    // -------------------------------------------------------------
    // 4. PRIORITY 2: CROSS-DEVICE GLOBAL SEARCH
    // -------------------------------------------------------------
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim().replace('@', '');

      if (!query) {
        searchResults.innerHTML = '';
        return;
      }

      searchTimeout = setTimeout(async () => {
        const { data, error } = await supabase
          .from('profiles')
          .select('id, username, display_name, avatar_url')
          .or(`username.ilike.%${query}%,display_name.ilike.%${query}%`)
          .limit(10);

        if (error) {
          searchResults.innerHTML = `<p style="color:red;">Search error: ${error.message}</p>`;
          return;
        }

        if (data.length === 0) {
          searchResults.innerHTML = '<p style="color:var(--text-muted); font-size: 0.85rem;">কোনো ব্যবহারকারী পাওয়া যায়নি।</p>';
          return;
        }

        searchResults.innerHTML = data.map(user => `
          <div class="user-item">
            <div class="avatar">${user.display_name.charAt(0).toUpperCase()}</div>
            <div>
              <strong>${user.display_name}</strong>
              <div style="font-size:0.8rem; color:var(--text-muted);">@${user.username}</div>
            </div>
          </div>
        `).join('');
      }, 300);
    });

    // -------------------------------------------------------------
    // 5. PRIORITY 3 & 4: GLOBAL POST FEED & REALTIME
    // -------------------------------------------------------------
    btnCreatePost.addEventListener('click', async () => {
      const content = postContent.value.trim();
      if (!content) return;

      btnCreatePost.disabled = true;

      try {
        const { error } = await supabase
          .from('posts')
          .insert([{ user_id: currentUser.id, content: content }]);

        if (error) throw error;

        postContent.value = '';
        showAlert('পোস্ট শেয়ার করা হয়েছে!', 'success');
        loadGlobalPosts(); // Refresh Feed
      } catch (err) {
        showAlert(err.message);
      } finally {
        btnCreatePost.disabled = false;
      }
    });

    async function loadGlobalPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select(`
          id,
          content,
          created_at,
          profiles:user_id (id, username, display_name)
        `)
        .order('created_at', { ascending: false });

      if (error) {
        globalFeed.innerHTML = '<p style="color:red;">পোস্ট লোড করতে সমস্যা হয়েছে।</p>';
        return;
      }

      if (data.length === 0) {
        globalFeed.innerHTML = '<p style="color:var(--text-muted);">এখনো কোনো পাবলিক পোস্ট নেই।</p>';
        return;
      }

      renderPosts(data);
    }

    function renderPosts(posts) {
      globalFeed.innerHTML = posts.map(post => {
        const authorName = post.profiles?.display_name || 'অজানা প্লেয়ার';
        const authorUsername = post.profiles?.username || 'user';
        const formattedDate = new Date(post.created_at).toLocaleString();

        return `
          <div class="post-item">
            <div class="post-header">
              <div class="avatar">${authorName.charAt(0).toUpperCase()}</div>
              <div>
                <strong>${authorName}</strong>
                <span style="font-size:0.8rem; color:var(--text-muted);">@${authorUsername}</span>
              </div>
              <span class="post-time">${formattedDate}</span>
            </div>
            <div class="post-content">${post.content}</div>
          </div>
        `;
      }).join('');
    }

    // Supabase Realtime Setup for New Posts
    function subscribeToRealtimePosts() {
      supabase
        .channel('public:posts')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => {
          loadGlobalPosts(); // Fetch new post automatically across all devices
        })
        .subscribe();
    }

    // Initialize Page
    checkAuthSession();
  </script>
</body>
</html>
