<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLD FREE FIRE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--elev:#141419;--hover:#1c1c24;--accent:#ff3b30;--text:#f5f5f7;--muted:#8e8e93;--border:#2c2c35}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
img{display:block;max-width:100%}
.grad{background:linear-gradient(135deg,#ff3b30,#ff6b00)}
.grad-text{background:linear-gradient(135deg,#ff3b30,#ff6b00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.display{font-family:'Orbitron',sans-serif}

/* AUTH */
#auth{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);overflow-y:auto}
.auth-box{width:100%;max-width:400px;margin:auto}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.auth-logo h1{font-size:22px;letter-spacing:2px}
.auth-tag{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.tabs{display:flex;background:var(--elev);border-radius:12px;padding:4px;margin-bottom:14px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;transition:.15s}
.tab.on{background:var(--hover);color:var(--text)}
.form{background:var(--elev);border:1px solid var(--border);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.form label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form input{width:100%;background:var(--hover);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-size:14px;outline:none}
.form input:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border-radius:11px;font-weight:700;color:#fff;transition:.15s;font-size:14px}
.btn:active{transform:scale(.98)}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--hover);color:var(--text)}
.err{color:var(--accent);font-size:12px;min-height:16px;text-align:center}
.msg{color:#22c55e;font-size:12px;min-height:16px;text-align:center}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:12px;padding:10px;background:var(--elev);border-radius:8px;border:1px solid var(--border)}

/* APP */
#app{display:none}
#app.on{display:block}
.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--elev);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40}
.brand{padding:22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand h1{font-size:12px;letter-spacing:1.5px}
.brand p{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px;border-radius:11px;font-size:14px;font-weight:500;transition:.15s;cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--hover);color:var(--accent);border-left-color:var(--accent)}
.side-foot{padding:10px;border-top:1px solid var(--border)}
.main{margin-left:240px;min-height:100vh;padding-bottom:40px}
.container{max-width:640px;margin:0 auto;padding:22px 16px}
.botnav{display:none}

.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hdr h2{font-size:22px;font-weight:800}
.hdr .sub{font-size:12px;color:var(--muted)}

.post{background:var(--elev);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:18px;animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:12px;padding:14px 16px}
.av{border-radius:50%;padding:2px;flex-shrink:0;background:linear-gradient(135deg,#ff3b30,#ff6b00);overflow:hidden}
.av-in{width:100%;height:100%;border-radius:50%;background:var(--elev);display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--elev);overflow:hidden}
.av-in img{width:100%;height:100%;object-fit:cover}
.pu{flex:1;min-width:0}
.pu .nm{font-size:14px;font-weight:600;cursor:pointer}
.pu .nm:hover{color:var(--accent)}
.pu .mt{font-size:11px;color:var(--muted);margin-top:2px}
.pm{position:relative;aspect-ratio:1;background:#000;cursor:pointer;user-select:none;-webkit-user-select:none}
.pm img{width:100%;height:100%;object-fit:cover}
.burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.burst.go{animation:pop .6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(0)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.5)}}
.burst svg{width:100px;height:100px;fill:#ff3b30;color:#ff3b30;filter:drop-shadow(0 0 20px rgba(255,59,48,.7))}
.pa{display:flex;align-items:center;gap:14px;padding:12px 16px 4px}
.act{display:flex;transition:transform .1s}
.act:active{transform:scale(.85)}
.act.lk svg{fill:var(--accent);color:var(--accent)}
.act:hover svg{color:var(--accent)}
.act svg{transition:color .2s}
.pb{padding:0 16px 16px}
.pl{font-size:14px;font-weight:600;margin-bottom:6px}
.pc{font-size:14px;line-height:1.5}
.pc .un{font-weight:600;margin-right:6px;cursor:pointer}
.pc .un:hover{color:var(--accent)}
.pcl{font-size:13px;color:var(--muted);margin-top:8px;cursor:pointer;display:inline-block}
.pcl:hover{color:var(--text)}

.search{position:relative;margin-bottom:18px}
.search input{width:100%;background:var(--elev);border:1px solid var(--border);border-radius:11px;padding:12px 14px 12px 40px;color:var(--text);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.eitem{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--elev)}
.eitem img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.eitem:hover img{transform:scale(1.05)}
.eitem .ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:14px;opacity:0;transition:.2s;color:#fff;font-weight:600;font-size:13px}
.eitem:hover .ov{opacity:1}
.eov{display:flex;align-items:center;gap:5px}

.ccard{background:var(--elev);border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.upload{border:2px dashed var(--border);border-radius:13px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s}
.upload:hover{border-color:var(--accent);background:var(--hover)}
.upload svg{color:var(--muted);margin-bottom:8px}
.upload p{font-size:14px;font-weight:600;margin-bottom:4px}
.upload span{font-size:12px;color:var(--muted)}
.prev{width:100%;border-radius:13px;max-height:400px;object-fit:contain;background:#000}
.cap{width:100%;background:var(--hover);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;resize:vertical;min-height:80px}
.cap:focus{border-color:var(--accent)}

.phead{display:flex;align-items:center;gap:22px;padding:22px 0;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.pav{border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff3b30,#ff6b00);flex-shrink:0;overflow:hidden}
.pav .av-in{font-size:32px}
.pinfo{flex:1;min-width:200px}
.pinfo h2{font-size:20px;font-weight:700;margin-bottom:6px}
.rbadge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:8px;color:#fff}
.pinfo .bio{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.pstats{display:flex;gap:22px}
.pstat{text-align:center}
.pstat .n{font-weight:700;font-size:16px}
.pstat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ptabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.ptab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--accent)}
.pgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.edit-btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:700;background:var(--hover);border:1px solid var(--border);transition:.15s;margin-top:10px}
.edit-btn:hover{border-color:var(--accent);color:var(--accent)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{margin-bottom:12px;opacity:.5}
.empty p{font-size:14px}

.bd{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none}
.bd.on{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--elev);border-top-left-radius:20px;border-top-right-radius:20px;max-height:75vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s}
.drawer.on{transform:none}
@media(min-width:768px){.drawer{max-width:500px;margin:0 auto;border-radius:20px;bottom:20px}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.dhead h3{font-size:15px;font-weight:700}
.dbody{flex:1;overflow-y:auto;padding:16px}
.cmt{display:flex;gap:12px;margin-bottom:14px}
.cmt .av{width:32px;height:32px}
.cmt .av-in{font-size:11px}
.cmt-c{flex:1;font-size:13px;line-height:1.5}
.cmt-c .cn{font-weight:600;margin-right:6px;cursor:pointer}
.cmt-c .cn:hover{color:var(--accent)}
.cmt-c .cm{font-size:11px;color:var(--muted);margin-top:4px}
.dinput{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.dinput input{flex:1;background:var(--hover);border:1px solid var(--border);border-radius:24px;padding:10px 16px;color:var(--text);font-size:13px;outline:none}
.dinput input:focus{border-color:var(--accent)}
.dinput button{background:var(--accent);color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-bd.on{display:flex}
.modal{background:var(--elev);border:1px solid var(--border);border-radius:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;animation:mIn .25s ease;margin:auto}
@keyframes mIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--elev);z-index:1}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.avatar-edit{display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar-edit .av{width:96px;height:96px;cursor:pointer;position:relative}
.avatar-edit .av-in{font-size:32px}
.avatar-edit .av-overlay{position:absolute;inset:2px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;color:#fff}
.avatar-edit .av:hover .av-overlay{opacity:1}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea,.field select{width:100%;background:var(--hover);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.field select{cursor:pointer}
.modal-foot{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--elev)}
.modal-foot .btn{flex:1}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--elev);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:13px;font-weight:600;z-index:500;transition:transform .3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.acc{border-color:var(--accent)}
.toast.ok{border-color:#22c55e}

@media(max-width:768px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:76px}
  .container{padding:16px 12px}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--elev);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .botnav .nav-item{flex:1;flex-direction:column;padding:8px 4px;gap:3px;border-left:none;border-top:2px solid transparent;border-radius:0;font-size:9px;justify-content:center}
  .botnav .nav-item.on{border-top-color:var(--accent);border-left:none;background:transparent}
  .botnav .nav-item:hover{background:transparent}
  .phead{gap:16px}
  .pav{width:72px !important;height:72px !important}
  .pav .av-in{font-size:24px}
  .pstats{gap:16px}
  .egrid{gap:2px}
  .toast{bottom:72px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" style="display:flex">
  <div class="auth-box">
    <div class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      <h1 class="display grad-text">OLD FREE FIRE</h1>
    </div>
    <p class="auth-tag">The Gamer Social Network</p>
    <div class="tabs">
      <div class="tab on" data-mode="login">Sign In</div>
      <div class="tab" data-mode="register">Create Account</div>
    </div>
    <div class="form">
      <div data-field="register" style="display:none">
        <label>Username</label>
        <input type="text" id="rg-user" placeholder="pro_gamer99" autocomplete="username">
      </div>
      <div data-field="register" style="display:none">
        <label>Display Name</label>
        <input type="text" id="rg-name" placeholder="Pro Gamer" autocomplete="name">
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="pass" placeholder="At least 4 characters" autocomplete="current-password">
      </div>
      <p class="err" id="err"></p>
      <p class="msg" id="msg"></p>
      <button class="btn grad" id="submitBtn">Sign In</button>
    </div>
    <div class="hint">First time? Click <b>Create Account</b> above</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      <div><h1 class="display grad-text">OLD FREE FIRE</h1><p>GAMER NETWORK</p></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="nav-item" id="logoutBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </div>
    </div>
  </aside>
  <main class="main"><div class="container" id="content"></div></main>
  <nav class="botnav" id="botNav"></nav>
</div>

<!-- DRAWER -->
<div class="bd" id="bd"></div>
<div class="drawer" id="drawer">
  <div class="dhead"><h3>Comments</h3>
    <button id="closeDrawer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="dbody" id="cList"></div>
  <div class="dinput">
    <input type="text" id="cInput" placeholder="Add a comment...">
    <button id="sendC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-bd" id="editModal">
  <div class="modal">
    <div class="modal-head"><h3>Edit Profile</h3>
      <button id="closeEdit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="avatar-edit">
        <div class="av" id="editAvatar" style="width:96px;height:96px">
          <div class="av-in" id="editAvatarIn" style="width:92px;height:92px;font-size:32px"></div>
          <div class="av-overlay"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        </div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none">
        <button class="edit-btn" id="changeAvatarBtn" style="margin-top:0;font-size:12px;padding:6px 14px">Change Photo</button>
      </div>
      <div class="field"><label>Username</label><input type="text" id="editUsername"></div>
      <div class="field"><label>Display Name</label><input type="text" id="editDisplay"></div>
      <div class="field"><label>Bio</label><textarea id="editBio"></textarea></div>
      <div class="field"><label>Rank</label>
        <select id="editRank">
          <option>Bronze</option><option>Silver</option><option>Gold</option><option>Platinum</option>
          <option>Diamond</option><option>Master</option><option>Heroic</option><option>Grandmaster</option>
        </select>
      </div>
      <p class="err" id="editErr"></p>
    </div>
    <div class="modal-foot">
      <button class="btn sec" id="cancelEdit">Cancel</button>
      <button class="btn grad" id="saveEdit">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ============================================================
  // SAFE STORAGE (works even if localStorage is blocked)
  // ============================================================
  var memStore = {};
  var storage = {
    get: function(k){
      try { return localStorage.getItem(k); }
      catch(e){ return memStore[k] || null; }
    },
    set: function(k,v){
      try { localStorage.setItem(k,v); }
      catch(e){ memStore[k]=v; }
    }
  };

  // ============================================================
  // STATE
  // ============================================================
  var DB = {
    users: [],     // { id, username, display_name, email, password, avatar_url, bio, rank }
    posts: [],     // { id, user_id, media_url, caption, like_count, comment_count, created_at }
    likes: [],     // { user_id, post_id }
    comments: [],  // { id, user_id, post_id, content, created_at }
    me: null       // current user id
  };
  var authMode = "login";
  var currentView = "feed";
  var activePost = null;
  var pendingImg = null;
  var pendingAvatar = null;

  // ============================================================
  // PERSISTENCE
  // ============================================================
  function save(){
    try { storage.set("off_data_v5", JSON.stringify(DB)); } catch(e){}
  }
  function load(){
    try {
      var raw = storage.get("off_data_v5");
      if (raw) {
        var p = JSON.parse(raw);
        if (p.users && p.users.length) {
          DB.users = p.users || [];

          DB.comments = p.comments || [];
          DB.me = p.me || null;
          return;
        }
      }
    } catch(e){}
    seed();
  }

  // ============================================================
  // HELPERS
  // ============================================================
  function $(s){ return document.querySelector(s); }
  function $$(s){ return document.querySelectorAll(s); }
  function findUser(id){ for(var i=0;i<DB.users.length;i++) if(DB.users[i].id===id) return DB.users[i]; return null; }
  function findPost(id){ for(var i=0;i<DB.posts.length;i++) if(DB.posts[i].id===id) return DB.posts[i]; return null; }
  function findByEmail(e){ e=(e||"").toLowerCase().trim(); for(var i=0;i<DB.users.length;i++) if(DB.users[i].email===e) return DB.users[i]; return null; }
  function findByName(n){ n=(n||"").toLowerCase().trim(); for(var i=0;i<DB.users.length;i++) if(DB.users[i].username===n) return DB.users[i]; return null; }
  function me(){ return findUser(DB.me); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
  function ago(ts){ var s=Math.floor((Date.now()-ts)/1000); if(s<60)return s+"s"; if(s<3600)return Math.floor(s/60)+"m"; if(s<86400)return Math.floor(s/3600)+"h"; if(s<604800)return Math.floor(s/86400)+"d"; return new Date(ts).toLocaleDateString(); }
  function isLiked(pid){ for(var i=0;i<DB.likes.length;i++) if(DB.likes[i].post_id===pid && DB.likes[i].user_id===DB.me) return true; return false; }
  function avatar(u,size){
    size=size||40;
    var inner = (u && u.avatar_url)
      ? '<img src="'+esc(u.avatar_url)+'" alt="">'
      : esc(((u && (u.display_name||u.username)) || "?").toUpperCase()[0]);
    return '<div class="av" style="width:'+size+'px;height:'+size+'px"><div class="av-in" style="width:'+(size-4)+'px;height:'+(size-4)+'px;font-size:'+Math.round(size*0.4)+'px">'+inner+'</div></div>';
  }
  function toast(msg,type){
    var t=$("#toast"); if(!t)return;
    t.textContent=msg;
    t.className="toast on"+(type==="ok"?" ok":type==="acc"?" acc":"");
    clearTimeout(t._tm);
    t._tm=setTimeout(function(){t.classList.remove("on");},2400);
  }
  function emptyState(msg){
    return '<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg><p>'+esc(msg)+'</p></div>';

  // ============================================================

  function setAuthMode(mode){
    authMode = mode;
    $$(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-mode")===mode); });
    $$("[data-field='register']").forEach(function(el){ el.style.display = mode==="register"?"block":"none"; });
    $("#err").textContent = "";
    $("#msg").textContent = "";
    $("#submitBtn").textContent = mode==="login" ? "Sign In" : "Create Account";
  }

  function doAuth(){
    var email = ($("#email").value||"").trim().toLowerCase();
    var pass  = $("#pass").value||"";
    var errEl = $("#err"); errEl.textContent = "";
    var msgEl = $("#msg"); msgEl.textContent = "";

    if (authMode === "login") {
      if (!email) return errEl.textContent = "Enter your email.";
      if (!pass)  return errEl.textContent = "Enter your password.";
      var user = findByEmail(email);
      if (!user) return errEl.textContent = "No account with this email. Click 'Create Account'.";
      if (user.password !== pass) return errEl.textContent = "Wrong password. Try again.";
      DB.me = user.id;
      save();
      enterApp();
      toast("Welcome back, " + user.username + "! 🔥", "ok");
    } else {
      var username = ($("#rg-user").value||"").trim().toLowerCase().replace(/\s/g,"");
      var display  = ($("#rg-name").value||"").trim();
      if (username.length < 3) return errEl.textContent = "Username needs 3+ characters.";
      if (!display) return errEl.textContent = "Enter a display name.";
      if (!email) return errEl.textContent = "Enter your email.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return errEl.textContent = "Enter a valid email address.";
      if (pass.length < 4) return errEl.textContent = "Password needs 4+ characters.";
      if (findByEmail(email)) return errEl.textContent = "This email is already registered. Try Sign In.";
      if (findByName(username)) return errEl.textContent = "Username already taken.";

      var newUser = {
        id: "u" + Date.now(),
        email: email,
        password: pass,
        username: username,
        display_name: display,
        avatar_url: null,
        bio: "New Free Fire player 🔥",
        rank: "Bronze"
      };
      DB.users.push(newUser);
      DB.me = newUser.id;
      save();
      enterApp();
      toast("Account created! Welcome to OLD FREE FIRE 🔥", "ok");
    }
  }

  function onAvatarChange(e){
    var f = e.target.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast("Image too large (max 2MB)", "acc"); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      pendingAvatar = ev.target.result;

  function saveProfile(){
    var u = me(); if (!u) return;
    var newUsername = ($("#editUsername").value||"").trim().toLowerCase().replace(/\s/g,"");
    var newDisplay  = ($("#editDisplay").value||"").trim();
    var newBio      = ($("#editBio").value||"").trim();
    var newRank     = $("#editRank").value;
    var errEl = $("#editErr"); errEl.textContent = "";

    if (newUsername.length < 3) return errEl.textContent = "Username needs 3+ characters.";
    for (var i=0; i<DB.users.length; i++){
      if (DB.users[i].id !== u.id && DB.users[i].username === newUsername){
        return errEl.textContent = "Username already taken.";
      }
    }
    if (!newDisplay) return errEl.textContent = "Display name can't be empty.";

    u.username = newUsername;
    u.display_name = newDisplay;
    u.bio = newBio;
    u.rank = newRank;
    if (pendingAvatar) u.avatar_url = pendingAvatar;
    save();
    closeEditProfile();
    toast("Profile updated ✅", "ok");
    go("profile", u.id);
  }

  // ============================================================
  // LIKE / SHARE
  // ============================================================
  function doLike(pid){
    var post = findPost(pid); if (!post) return;
    var idx = -1;
    for (var i=0; i<DB.likes.length; i++){
      if (DB.likes[i].post_id===pid && DB.likes[i].user_id===DB.me) { idx=i; break; }
    }
    if (idx === -1){
      DB.likes.push({ user_id: DB.me, post_id: pid });
      post.like_count++;
    } else {
      DB.likes.splice(idx, 1);
      post.like_count = Math.max(0, post.like_count - 1);
    }
    save();
    var btn = document.getElementById("lk-"+pid);
    var cnt = document.getElementById("cnt-"+pid);
    var nowLiked = isLiked(pid);
    if (btn) {
      btn.classList.toggle("lk", nowLiked);
      btn.querySelector("svg").setAttribute("fill", nowLiked ? "currentColor" : "none");
    }
    if (cnt) cnt.textContent = post.like_count.toLocaleString() + " likes";
  }

  function doDouble(pid){
    if (!isLiked(pid)) doLike(pid);
    var b = document.getElementById("burst-"+pid);
    if (b) { b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); }
  }

  function doShare(pid){
    var url = location.origin + location.pathname + "#post-" + pid;
    if (navigator.share) navigator.share({ title: "OLD FREE FIRE", url: url }).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast("Link copied!", "ok"); }).catch(function(){});
    else toast("Post link: " + url);
  }

  function renderComments(){
    var list = $("#cList");
    var cs = DB.comments.filter(function(c){ return c.post_id === activePost; }).sort(function(a,b){ return a.created_at - b.created_at; });
    if (!cs.length) { list.innerHTML = '<div class="empty" style="padding:30px 0"><p>No comments yet. Be the first!</p></div>'; return; }
    list.innerHTML = cs.map(function(c){
      var u = findUser(c.user_id); if (!u) return "";
      return '<div class="cmt">'+avatar(u,32)+'<div class="cmt-c"><span class="cn" data-profile="'+u.id+'">'+esc(u.username)+'</span>'+esc(c.content)+'<div class="cm">'+ago(c.created_at)+'</div></div></div>';
    }).join("");
    bindProfileClicks();
  }
  function sendComment(){
    var input = $("#cInput");
    var txt = (input.value||"").trim();
    if (!txt || !activePost) return;
    DB.comments.push({
      id: "c" + Date.now(),
      user_id: DB.me,
      post_id: activePost,
      content: txt,
      created_at: Date.now()
    });
    var post = findPost(activePost);
    if (post) post.comment_count++;
    input.value = "";
    save();
    renderComments();
    if (currentView === "feed") go("feed");
  }

  // ============================================================
  // BINDING
  // ============================================================
  function bindProfileClicks(){
    $$("[data-profile]").forEach(function(el){
      el.onclick = function(){ go("profile", el.getAttribute("data-profile")); };
    });
  }

  function bindAll(){
    $$(".tab").forEach(function(t){
      t.onclick = function(){ setAuthMode(t.getAttribute("data-mode")); };
    });
    $("#submitBtn").onclick = doAuth;
    $("#email").addEventListener("keydown", function(e){ if (e.key==="Enter") doAuth(); });
    $("#pass").addEventListener("keydown", function(e){ if (e.key==="Enter") doAuth(); });

    $("#logoutBtn").onclick = logout;
    $("#closeDrawer").onclick = closeComments;
    $("#bd").onclick = closeComments;
    $("#sendC").onclick = sendComment;
    $("#cInput").addEventListener("keydown", function(e){ if (e.key==="Enter") sendComment(); });

    $("#closeEdit").onclick = closeEditProfile;
    $("#cancelEdit").onclick = closeEditProfile;
    $("#saveEdit").onclick = saveProfile;
    $("#changeAvatarBtn").onclick = function(){ $("#avatarFile").click(); };
    $("#editAvatar").onclick = function(){ $("#avatarFile").click(); };
    $("#avatarFile").addEventListener("change", onAvatarChange);
    $("#editModal").addEventListener("click", function(e){ if (e.target.id==="editModal") closeEditProfile(); });

    document.body.addEventListener("click", function(e){
      var t;
      if ((t = e.target.closest("[data-edit-profile]"))) return openEditProfile();
      if ((t = e.target.closest("[data-like]"))) return doLike(t.getAttribute("data-like"));
      if ((t = e.target.closest("[data-comment]"))) return openComments(t.getAttribute("data-comment"));
      if ((t = e.target.closest("[data-share]"))) return doShare(t.getAttribute("data-share"));
      if ((t = e.target.closest("[data-profile]"))) return go("profile", t.getAttribute("data-profile"));
      if (e.target.closest("#uploadArea")) { var fi=$("#fileInput"); if (fi) fi.click(); return; }
      if (e.target.closest("#shareBtn")) return submitPost();
    });

    document.body.addEventListener("dblclick", function(e){
      var t = e.target.closest("[data-dbl]");
      if (t) doDouble(t.getAttribute("data-dbl"));
    });

    document.body.addEventListener("change", function(e){
      if (e.target.id === "fileInput") onFileChange(e);
    });

    document.body.addEventListener("input", function(e){
      if (e.target.id === "searchInput") {
        var q = e.target.value.toLowerCase().trim();
        var others = DB.users.filter(function(u){
          return u.id !== DB.me && (u.username.indexOf(q)>=0 || (u.display_name||"").toLowerCase().indexOf(q)>=0);
        });
        var g = $("#pgrid");
        if (g) g.innerHTML = others.length ? others.map(function(u){
          return '<div style="background:var(--elev);border:1px solid var(--border);border-radius:13px;padding:16px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:10px">'+avatar(u,56)+'</div><div style="font-weight:600;font-size:14px;margin-bottom:2px;cursor:pointer" data-profile="'+u.id+'">'+esc(u.username)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(u.rank||"Bronze")+'</div></div>';
        }).join("") : '<p style="color:var(--muted);font-size:13px;grid-column:1/-1">No players found.</p>';
        bindProfileClicks();
      }
    });
  }

  // ============================================================
  // BOOT
  // ============================================================
  function boot(){
    try {
      load();
      setAuthMode("login");
      bindAll();
      if (DB.me && findUser(DB.me)) {
        enterApp();
      } else {
        DB.me = null;
        save();
      }
    } catch (err) {
      console.error("Boot error:", err);
      document.body.innerHTML = '<div style="padding:30px;color:#ff3b30;font-family:monospace"><h2>Startup Error</h2><pre>' + String(err) + '</pre></div>';
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

})();
</script>
</body>
</html>
